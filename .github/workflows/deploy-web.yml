name: Deploy web version

# Builds the web version of the game and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://ptodari.github.io/Toonville/
on:
  push:
    branches: [main, claude/toonville-game]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run engine tests
        run: npm test

      - name: Export web build
        run: npx expo export --platform web --output-dir dist

      - name: Home-screen icon, manifest, 404 fallback
        run: node scripts/web-postbuild.mjs dist /Toonville

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
